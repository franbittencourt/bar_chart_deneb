<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Preview — Colunas Agrupadas Dinâmicas (Deneb / Vega)</title>
  <script src="https://cdn.jsdelivr.net/npm/vega@5/build/vega.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", sans-serif;
      background: #f4f6f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 32px 16px;
    }
    h1 {
      font-size: 18px;
      font-weight: 600;
      color: #1a1a2e;
      margin-bottom: 6px;
      text-align: center;
    }
    p.subtitle {
      font-size: 13px;
      color: #666;
      margin-bottom: 28px;
      text-align: center;
    }
    #chart-container {
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.10);
      padding: 24px 24px 16px 24px;
      width: 880px;
      max-width: 100%;
    }
    #view { width: 100%; }
  </style>
</head>
<body>
  <h1>Gráfico de Colunas Agrupadas Dinâmicas</h1>
  <p class="subtitle">Vega · Deneb · Power BI &nbsp;|&nbsp; Clique no toggle para alternar entre visão Mensal e Acumulada (YTD)</p>
  <div id="chart-container">
    <div id="view"></div>
  </div>

  <script>
    const spec = {
      "$schema": "https://vega.github.io/schema/vega/v5.json",
      "width": 820,
      "height": 360,
      "padding": {"left": 10, "right": 10, "top": 20, "bottom": 20},
      "autosize": {"type": "fit", "contains": "padding"},

      "config": {
        "locale": {
          "number": {
            "decimal": ",",
            "thousands": ".",
            "grouping": [3],
            "currency": ["R$ ", ""]
          }
        }
      },

      "signals": [
        {"name": "campoMes",       "value": "Ano_Mes_abrev"},
        {"name": "campoPlan",      "value": "m_Plan"},
        {"name": "campoReal",      "value": "m_Real"},
        {"name": "campoProj",      "value": "m_Proj"},
        {"name": "labelPlan",      "value": "Planejado"},
        {"name": "labelReal",      "value": "Realizado"},
        {"name": "labelProj",      "value": "Projetado"},
        {"name": "corPlan",        "value": "#4472C4"},
        {"name": "corReal",        "value": "#70AD47"},
        {"name": "corProj",        "value": "#ED7D31"},
        {"name": "paddingGrupo",   "value": 0.3},
        {"name": "paddingBarra",   "value": 0.05},
        {"name": "raioAresta",     "value": 3},
        {"name": "mostrarRotulos", "value": true},
        {"name": "tamanhoRotulo",  "value": 8},
        {"name": "fontePadrao",    "value": "Segoe UI, sans-serif"},
        {"name": "alturaHeader",   "value": 58},
        {
          "name": "modoAcumulado",
          "value": false,
          "on": [
            {
              "events": [
                {"markname": "btn_mensal_rect", "type": "click"},
                {"markname": "btn_mensal_txt",  "type": "click"}
              ],
              "update": "false"
            },
            {
              "events": [
                {"markname": "btn_acum_rect", "type": "click"},
                {"markname": "btn_acum_txt",  "type": "click"}
              ],
              "update": "true"
            }
          ]
        }
      ],

      "data": [
        {
          "name": "source",
          "values": [
            {"Ano_Mes_abrev": "Jan/26", "m_Plan": 2700000, "m_Real": 2010000, "m_Proj": null},
            {"Ano_Mes_abrev": "Fev/26", "m_Plan": 2900000, "m_Real": 2420000, "m_Proj": null},
            {"Ano_Mes_abrev": "Mar/26", "m_Plan": 2600000, "m_Real": 2340000, "m_Proj": null},
            {"Ano_Mes_abrev": "Abr/26", "m_Plan": 2510000, "m_Real": 2820000, "m_Proj": null},
            {"Ano_Mes_abrev": "Mai/26", "m_Plan": 2420000, "m_Real": 2910000, "m_Proj": null},
            {"Ano_Mes_abrev": "Jun/26", "m_Plan": 2440000, "m_Real": 2410000, "m_Proj": null},
            {"Ano_Mes_abrev": "Jul/26", "m_Plan": 2620000, "m_Real": null,   "m_Proj": 2610000},
            {"Ano_Mes_abrev": "Ago/26", "m_Plan": 2740000, "m_Real": null,   "m_Proj": 2720000},
            {"Ano_Mes_abrev": "Set/26", "m_Plan": 2730000, "m_Real": null,   "m_Proj": 2720000},
            {"Ano_Mes_abrev": "Out/26", "m_Plan": 2820000, "m_Real": null,   "m_Proj": 2810000},
            {"Ano_Mes_abrev": "Nov/26", "m_Plan": 2900000, "m_Real": null,   "m_Proj": 2890000},
            {"Ano_Mes_abrev": "Dez/26", "m_Plan": 3000000, "m_Real": null,   "m_Proj": 3000000}
          ]
        },
        {
          "name": "proc",
          "source": "source",
          "transform": [
            {"type": "formula", "as": "_mes",  "expr": "datum[campoMes]"},
            {"type": "formula", "as": "_plan", "expr": "datum[campoPlan]"},
            {"type": "formula", "as": "_real", "expr": "datum[campoReal]"},
            {"type": "formula", "as": "_proj", "expr": "datum[campoProj]"},
            {
              "type": "formula",
              "as": "_exec",
              "expr": "(isValid(datum[campoReal]) && datum[campoReal] !== null ? datum[campoReal] : 0) + (isValid(datum[campoProj]) && datum[campoProj] !== null ? datum[campoProj] : 0)"
            },
            {
              "type": "window",
              "ops": ["sum", "sum"],
              "fields": ["_plan", "_exec"],
              "as":     ["_plan_acum", "_exec_acum"],
              "frame":  [null, 0]
            }
          ]
        },
        {
          "name": "bars_plan",
          "source": "proc",
          "transform": [
            {"type": "formula", "as": "serie", "expr": "labelPlan"},
            {"type": "formula", "as": "valor", "expr": "modoAcumulado ? datum._plan_acum : datum._plan"},
            {"type": "formula", "as": "ordem", "expr": "0"}
          ]
        },
        {
          "name": "bars_real",
          "source": "proc",
          "transform": [
            {"type": "filter",  "expr": "isValid(datum._real) && datum._real !== null"},
            {"type": "formula", "as": "serie", "expr": "labelReal"},
            {"type": "formula", "as": "valor", "expr": "modoAcumulado ? datum._exec_acum : datum._real"},
            {"type": "formula", "as": "ordem", "expr": "1"}
          ]
        },
        {
          "name": "bars_proj",
          "source": "proc",
          "transform": [
            {"type": "filter",  "expr": "isValid(datum._proj) && datum._proj !== null"},
            {"type": "formula", "as": "serie", "expr": "labelProj"},
            {"type": "formula", "as": "valor", "expr": "modoAcumulado ? datum._exec_acum : datum._proj"},
            {"type": "formula", "as": "ordem", "expr": "1"}
          ]
        },
        {
          "name": "bars",
          "source": ["bars_plan", "bars_real", "bars_proj"],
          "transform": [
            {
              "type": "joinaggregate",
              "groupby": ["_mes"],
              "ops": ["sum", "count"],
              "fields": ["valor", "valor"],
              "as": ["_soma_mes", "_n_mes"]
            },
            {"type": "formula", "as": "_valor_irmao", "expr": "datum._soma_mes - datum.valor"}
          ]
        }
      ],

      "scales": [
        {
          "name": "xscale",
          "type": "band",
          "domain": {"data": "bars_plan", "field": "_mes"},
          "range": "width",
          "padding": {"signal": "paddingGrupo"}
        },
        {
          "name": "xinner",
          "type": "band",
          "domain": [0, 1],
          "range": {"signal": "[0, bandwidth('xscale')]"},
          "padding": {"signal": "paddingBarra"}
        },
        {
          "name": "yscale",
          "type": "linear",
          "domain": {"data": "bars", "field": "valor"},
          "range": [{"signal": "height"}, {"signal": "alturaHeader"}],
          "nice": true,
          "zero": true
        },
        {
          "name": "color",
          "type": "ordinal",
          "domain": {"signal": "[labelPlan, labelReal, labelProj]"},
          "range": {"signal": "[corPlan, corReal, corProj]"}
        }
      ],

      "axes": [
        {
          "orient": "bottom",
          "scale": "xscale",
          "domain": false,
          "ticks": false,
          "labelPadding": 10,
          "labelFont": "Segoe UI, sans-serif",
          "labelFontSize": 11,
          "labelColor": "#404040",
          "labelAngle": -35,
          "labelAlign": "right",
          "labelBaseline": "middle",
          "labelOverlap": false
        },
        {
          "orient": "left",
          "scale": "yscale",
          "domain": false,
          "ticks": false,
          "tickCount": 5,
          "grid": true,
          "gridColor": "#e8e8e8",
          "gridOpacity": 1,
          "labelFont": "Segoe UI, sans-serif",
          "labelFontSize": 11,
          "labelColor": "#666666",
          "format": "$,.0f",
          "labelOverlap": "greedy"
        }
      ],

      "legends": [
        {
          "fill": "color",
          "orient": "bottom",
          "direction": "horizontal",
          "padding": 12,
          "columnPadding": 24,
          "symbolType": "square",
          "symbolSize": 120,
          "symbolStrokeWidth": 0,
          "labelFont": "Segoe UI, sans-serif",
          "labelFontSize": 12,
          "labelColor": "#404040"
        }
      ],

      "marks": [
        {
          "type": "group",
          "encode": {
            "enter": {
              "x":      {"signal": "width - 162"},
              "y":      {"value": 8},
              "width":  {"value": 157},
              "height": {"value": 24},
              "clip":   {"value": false}
            }
          },
          "marks": [
            {
              "type": "rect",
              "encode": {
                "enter": {
                  "x": {"value": 0}, "y": {"value": 0},
                  "width": {"value": 157}, "height": {"value": 24},
                  "cornerRadius": {"value": 12},
                  "fill": {"value": "#dde1e7"}
                }
              }
            },
            {
              "type": "rect",
              "encode": {
                "update": {
                  "x":            {"signal": "modoAcumulado ? 79 : 0"},
                  "y":            {"value": 0},
                  "width":        {"value": 78},
                  "height":       {"value": 24},
                  "cornerRadius": {"value": 12},
                  "fill":         {"value": "#4472C4"}
                }
              }
            },
            {
              "type": "text",
              "name": "btn_mensal_txt",
              "encode": {
                "update": {
                  "x": {"value": 39}, "y": {"value": 12},
                  "align": {"value": "center"}, "baseline": {"value": "middle"},
                  "text": {"value": "Mensal"},
                  "fill": {"signal": "modoAcumulado ? '#666666' : '#ffffff'"},
                  "font": {"value": "Segoe UI, sans-serif"},
                  "fontSize": {"value": 11}, "fontWeight": {"value": "600"},
                  "cursor": {"value": "pointer"}
                }
              }
            },
            {
              "type": "text",
              "name": "btn_acum_txt",
              "encode": {
                "update": {
                  "x": {"value": 118}, "y": {"value": 12},
                  "align": {"value": "center"}, "baseline": {"value": "middle"},
                  "text": {"value": "Acumulado"},
                  "fill": {"signal": "modoAcumulado ? '#ffffff' : '#666666'"},
                  "font": {"value": "Segoe UI, sans-serif"},
                  "fontSize": {"value": 11}, "fontWeight": {"value": "600"},
                  "cursor": {"value": "pointer"}
                }
              }
            },
            {
              "type": "rect",
              "name": "btn_mensal_rect",
              "encode": {
                "enter": {
                  "x": {"value": 0}, "y": {"value": 0},
                  "width": {"value": 79}, "height": {"value": 24},
                  "fill": {"value": "#000000"}, "fillOpacity": {"value": 0.001},
                  "cursor": {"value": "pointer"}
                }
              }
            },
            {
              "type": "rect",
              "name": "btn_acum_rect",
              "encode": {
                "enter": {
                  "x": {"value": 79}, "y": {"value": 0},
                  "width": {"value": 78}, "height": {"value": 24},
                  "fill": {"value": "#000000"}, "fillOpacity": {"value": 0.001},
                  "cursor": {"value": "pointer"}
                }
              }
            }
          ]
        },

        {
          "type": "group",
          "from": {
            "facet": {
              "data": "bars",
              "name": "bars_por_mes",
              "groupby": "_mes"
            }
          },
          "encode": {
            "enter": {
              "x":      {"scale": "xscale", "field": "_mes"},
              "width":  {"signal": "bandwidth('xscale')"},
              "height": {"signal": "height"},
              "clip":   {"value": false}
            }
          },
          "marks": [
            {
              "type": "rect",
              "name": "barra",
              "from": {"data": "bars_por_mes"},
              "encode": {
                "update": {
                  "x":                    {"scale": "xinner", "field": "ordem"},
                  "width":                {"signal": "bandwidth('xinner')"},
                  "y":                    {"scale": "yscale", "field": "valor"},
                  "y2":                   {"scale": "yscale", "value": 0},
                  "fill":                 {"scale": "color",  "field": "serie"},
                  "cornerRadiusTopLeft":  {"signal": "raioAresta"},
                  "cornerRadiusTopRight": {"signal": "raioAresta"},
                  "fillOpacity":          {"value": 1},
                  "tooltip": {
                    "signal": "{'Mês': datum._mes, 'Tipo': datum.serie, 'Modo': modoAcumulado ? 'Acumulado' : 'Mensal', 'Valor': format(datum.valor, '$,.0f')}"
                  }
                },
                "hover": {
                  "fillOpacity": {"value": 0.7},
                  "cursor":      {"value": "pointer"}
                }
              }
            },
            {
              "type": "text",
              "from": {"data": "bars_por_mes"},
              "encode": {
                "update": {
                  "x":          {"signal": "scale('xinner', datum.ordem) + bandwidth('xinner') / 2"},
                  "y": {
                    "signal": "datum.ordem == 1 && datum._n_mes == 2 && abs(scale('yscale', datum.valor) - scale('yscale', datum._valor_irmao)) < tamanhoRotulo + 4 ? ((scale('yscale', 0) - scale('yscale', datum.valor)) > tamanhoRotulo + 12 ? scale('yscale', datum.valor) + tamanhoRotulo + 5 : min(scale('yscale', datum.valor), scale('yscale', datum._valor_irmao)) - tamanhoRotulo - 7) : scale('yscale', datum.valor) - 5"
                  },
                  "align":      {"value": "center"},
                  "baseline":   {"value": "bottom"},
                  "font":       {"value": "Segoe UI, sans-serif"},
                  "fontSize":   {"signal": "tamanhoRotulo"},
                  "fontWeight": {"value": "600"},
                  "fill": {
                    "signal": "datum.ordem == 1 && datum._n_mes == 2 && abs(scale('yscale', datum.valor) - scale('yscale', datum._valor_irmao)) < tamanhoRotulo + 4 && (scale('yscale', 0) - scale('yscale', datum.valor)) > tamanhoRotulo + 12 ? '#ffffff' : '#404040'"
                  },
                  "text": {
                    "signal": "mostrarRotulos ? (datum.valor >= 10000000 ? format(datum.valor / 1000000, ',.0f') + 'M' : (datum.valor >= 1000000 ? format(datum.valor / 1000000, ',.1f') + 'M' : format(datum.valor / 1000, ',.0f') + 'K')) : ''"
                  }
                }
              }
            }
          ]
        }
      ]
    };

    new vega.View(vega.parse(spec), {
      renderer: 'canvas',
      container: '#view',
      hover: true
    }).run();
  </script>
</body>
</html>
